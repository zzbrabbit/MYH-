<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — MYHBeauty</title>
  <meta name="description" content="MYHBeauty admin dashboard login.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---------- Login Page ---------- */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f5f5f5 0%, #ede0f5 50%, #e0d0f0 100%);
    }

    /* Decorative background blobs */
    .login-page::before,
    .login-page::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    .login-page::before {
      width: 480px; height: 480px;
      background: radial-gradient(circle, rgba(138,28,196,.4), transparent 70%);
      top: -120px; right: -120px;
    }
    .login-page::after {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(102,0,153,.3), transparent 70%);
      bottom: -100px; left: -100px;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(138, 28, 196, 0.2);
      border-radius: 20px;
      padding: 3rem 2.5rem 2.5rem;
      box-shadow: 0 20px 60px rgba(51, 51, 51, 0.1), 0 4px 20px rgba(51, 51, 51, 0.05);
      animation: loginFadeIn 0.7s ease both;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo a {
      font-family: var(--ff-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--c-dark);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .login-logo a span {
      color: var(--c-accent);
      font-style: italic;
    }
    .login-logo .login-subtitle {
      display: block;
      font-family: var(--ff-sans);
      font-size: 0.8rem;
      color: var(--c-text-soft);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .login-form .form-group {
      margin-bottom: 1.5rem;
    }
    .login-form label {
      display: block;
      font-family: var(--ff-sans);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--c-dark);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .login-form .input-wrap {
      position: relative;
    }
    .login-form .input-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--c-text-soft);
      pointer-events: none;
    }
    .login-form input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      font-family: var(--ff-sans);
      font-size: 0.95rem;
      color: var(--c-dark);
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid rgba(138, 28, 196, 0.25);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      box-sizing: border-box;
    }
    .login-form input::placeholder {
      color: var(--c-text-soft);
      opacity: 0.7;
    }
    .login-form input:focus {
      border-color: var(--c-accent);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(138, 28, 196, 0.12);
    }
    .login-form .toggle-pwd {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--c-text-soft);
      padding: 0.25rem;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .login-form .toggle-pwd:hover { color: var(--c-accent); }
    .login-form .toggle-pwd svg { width: 18px; height: 18px; }

    .login-error {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(197, 80, 80, 0.08);
      border: 1px solid rgba(197, 80, 80, 0.25);
      border-radius: 10px;
      color: #b04545;
      font-family: var(--ff-sans);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      animation: shake 0.4s ease;
    }
    .login-error.show { display: flex; }
    .login-error svg { width: 16px; height: 16px; flex-shrink: 0; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      font-family: var(--ff-sans);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, var(--c-accent), var(--c-accent-d));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.25s, opacity 0.2s;
      box-shadow: 0 8px 24px rgba(138, 28, 196, 0.3);
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(138, 28, 196, 0.4);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(138, 28, 196, 0.15);
    }
    .login-footer a {
      font-family: var(--ff-sans);
      font-size: 0.85rem;
      color: var(--c-text-soft);
      text-decoration: none;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .login-footer a:hover { color: var(--c-accent); }
    .login-footer a svg { width: 14px; height: 14px; }

    .login-hint {
      text-align: center;
      margin-top: 1.25rem;
      font-family: var(--ff-sans);
      font-size: 0.78rem;
      color: var(--c-text-soft);
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .login-card { padding: 2.5rem 1.75rem 2rem; }
      .login-logo a { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <main class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <a href="index.html">MYH<span>Beauty</span></a>
        <span class="login-subtitle">Admin Dashboard</span>
      </div>

      <!-- Login Form -->
      <form class="login-form" id="loginForm" autocomplete="off" novalidate>

        <!-- Error Message -->
        <div class="login-error" id="loginError">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="errorText">Invalid username or password. Please try again.</span>
        </div>

        <!-- Username -->
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="off">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="new-password">
            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

        <!-- Hint -->
        <p class="login-hint">Authorized personnel only. Please enter your credentials.</p>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back to Website
        </a>
      </div>

    </div>
  </main>

  <script src="js/store.js"></script>
  <script>
    (function() {
      // If already logged in, go straight to admin
      if (typeof Auth !== 'undefined' && Auth.isLoggedIn()) {
        window.location.href = 'admin.html';
        return;
      }

      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorBox = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const loginBtn = document.getElementById('loginBtn');
      const togglePwd = document.getElementById('togglePwd');
      const eyeIcon = document.getElementById('eyeIcon');

      // Toggle password visibility
      const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      const eyeClosed = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>';
      togglePwd.addEventListener('click', () => {
        const isPwd = passwordInput.type === 'password';
        passwordInput.type = isPwd ? 'text' : 'password';
        eyeIcon.innerHTML = isPwd ? eyeClosed : eyeOpen;
      });

      // Clear error on input
      [usernameInput, passwordInput].forEach(input => {
        input.addEventListener('input', () => {
          if (errorBox.classList.contains('show')) errorBox.classList.remove('show');
        });
      });

      // Form submit
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value;
        const password = passwordInput.value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        // Disable button, show loading state
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        // Simulate brief delay for UX
        setTimeout(() => {
          const success = Auth.login(username, password);
          if (success) {
            loginBtn.textContent = 'Success! Redirecting...';
            window.location.href = 'admin.html';
          } else {
            showError('Invalid username or password. Please try again.');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
            passwordInput.value = '';
            passwordInput.focus();
          }
        }, 400);
      });

      function showError(msg) {
        errorText.textContent = msg;
        errorBox.classList.remove('show');
        // Trigger reflow to restart animation
        void errorBox.offsetWidth;
        errorBox.classList.add('show');
      }

      // Focus username on load
      usernameInput.focus();
    })();
  </script>
</body>
</html>
